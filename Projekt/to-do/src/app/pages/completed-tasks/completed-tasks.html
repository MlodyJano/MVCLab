<div class="container mt-4">
  <h2 class="text-success"><i class="bi bi-check-circle-fill"></i> Ukończone zadania</h2>
  <hr>

  <ul class="list-group shadow-sm">
    @for (task of completedTasks; track task.id) {
      <li class="list-group-item d-flex justify-content-between align-items-center list-group-item-light">
        <div>
          <span class="text-decoration-line-through text-muted h5">{{ task.title }}</span>
          <small class="d-block text-muted">Zakończono: {{ task.date }}</small>
        </div>
        
        <div>
          <button class="btn btn-outline-primary btn-sm me-2" (click)='onRestore(task.id)'>
            Przywróć
          </button>
          <button class="btn btn-outline-danger btn-sm" (click)="onDelete(task.id)">
            Usuń na zawsze
          </button>
        </div>
      </li>
    } @empty {
      <div class="alert alert-info">Nie masz jeszcze żadnych ukończonych zadań. Do roboty!</div>
    }
  </ul>
  
  <button class="btn btn-secondary mt-3" routerLink="/tasks">Wróć do listy zadań</button>
</div>
