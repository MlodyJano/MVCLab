<div class="container mt-4">
  <h2>Moje Zadania</h2>
  
  <div class="input-group mb-3">
    <input type="text" class="form-control" placeholder="Co masz do zrobienia?" 
           [(ngModel)]="newTaskTitle">
    <button class="btn btn-success" (click)="addTask()">Dodaj</button>
  </div>

  <ul class="list-group">
    @for (task of tasks; track task.id) {
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          <input type="checkbox" class="form-check-input me-2" [(ngModel)]="task.completed" (change)="onToggle(task.id)">
          <span [style.text-decoration]="task.completed ? 'line-through' : 'none'">
            {{ task.title }}
          </span>
        </div>
        <button class="btn btn-danger btn-sm" (click)="deleteTask(task.id)">Usuń</button>
      </li>
    }
  </ul>
</div>
